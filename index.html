<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados hub</title>

  <!-- Favicon / Tabblad Icoontje -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121316;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER / TOPBAR */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #16181d;
      border-bottom: 1px solid #232730;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo {
      height: 38px;
      width: 38px;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand {
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
    }

    .home-btn {
      font-size: 0.9rem;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }

    .home-btn:hover {
      color: #fbbf24;
    }

    /* SIDEBAR */
    aside {
      width: 260px;
      height: 100vh;
      background-color: #16181d;
      border-right: 1px solid #232730;
      padding-top: 80px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
    }

    .sidebar-section {
      padding: 0 16px;
      margin-bottom: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      color: #f8fafc;
      background-color: #1e222b;
    }

    .nav-item.active {
      color: #fbbf24;
      background-color: #1e222b;
      font-weight: 500;
    }

    .arrow {
      font-size: 0.8rem;
      opacity: 0.5;
    }

    /* MAIN CONTENT */
    main {
      flex-grow: 1;
      padding-top: 60px;
      height: 100vh;
      background-color: #0f1013;
      display: flex;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* WATERMARK */
    .watermark {
      position: absolute;
      bottom: 15px;
      left: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand-container" onclick="openHome()">
      <img src="fusilados.png" alt="Fusilados Logo" class="brand-logo">
      <div class="brand">Fusilados hub</div>
    </div>
    <div class="home-btn" onclick="openHome()">Home</div>
  </header>

  <aside>
    <div class="sidebar-section">Minigames</div>

    <ul class="nav-list">
      <li class="nav-item" onclick="loadGame(this, 'Memory.html')">
        <span>Memory Grid</span>
        <span class="arrow">&gt;</span>
      </li>

      <li class="nav-item" onclick="loadGame(this, 'NumberHack.html')">
        <span>Number Hack</span>
        <span class="arrow">&gt;</span>
      </li>

      <li class="nav-item" onclick="loadGame(this, 'WT_Hack.html')">
        <span>WT Hack</span>
        <span class="arrow">&gt;</span>
      </li>

      <li class="nav-item" onclick="loadGame(this, 'Winkel_DVD_Hack.html')">
        <span>Winkel DVD Hack</span>
        <span class="arrow">&gt;</span>
      </li>

      <li class="nav-item" onclick="loadGame(this, 'Bobcat_1.html')">
        <span>Bobcat 1</span>
        <span class="arrow">&gt;</span>
      </li>

      <li class="nav-item" onclick="loadGame(this, 'GPS_Hack.html')">
        <span>GPS Hack</span>
        <span class="arrow">&gt;</span>
      </li>
    </ul>

    <div class="watermark">Created by RubDeDup</div>
  </aside>

  <main>
    <iframe id="gameFrame" src="Home.html" title="Minigame Hub"></iframe>
  </main>

  <script>
    function loadGame(element, url) {
      document.getElementById("gameFrame").src = url;

      const items = document.querySelectorAll(".nav-item");
      items.forEach(function(item) {
        item.classList.remove("active");
      });

      if (element) {
        element.classList.add("active");
      }
    }

    function openHome() {
      document.getElementById("gameFrame").src = "Home.html";
      const items = document.querySelectorAll(".nav-item");
      items.forEach(function(item) {
        item.classList.remove("active");
      });
    }

    function loadGameFromHome(url) {
      const items = document.querySelectorAll(".nav-item");
      items.forEach(function(item) {
        item.classList.remove("active");
        if (item.getAttribute("onclick") && item.getAttribute("onclick").includes(url)) {
          item.classList.add("active");
        }
      });
      document.getElementById("gameFrame").src = url;
    }
  </script>

</body>
</html>
