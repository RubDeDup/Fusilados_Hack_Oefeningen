<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockpick Minigame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #161922;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 360px;
      position: relative;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #8a8f9d;
      margin-bottom: 20px;
    }

    .game-box {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto;
    }

    canvas {
      background: transparent;
      border-radius: 50%;
    }

    /* Bolletjes voortgangsbalk */
    .stage-tracker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #2b303c;
      border: 2px solid #3d4454;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #22c55e;
      border-color: #4ade80;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }

    .instructions {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #a0a5b5;
      background: #1f2430;
      padding: 8px 12px;
      border-radius: 8px;
    }

    kbd {
      background: #333a4d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
    }

    /* Overlayscherm bij succes */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 25, 34, 0.95);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .success-icon {
      font-size: 3.5rem;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 20px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>LOCKPICKING</h1>
    <p class="subtitle">Kraak het slot</p>

    <div class="game-box">
      <canvas id="lockCanvas" width="250" height="250"></canvas>
    </div>

    <div class="stage-tracker">
      <div class="dot" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
    </div>

    <div class="instructions">
      Druk op <kbd>SPATIE</kbd> in de groene zone
    </div>

    <div class="overlay" id="successOverlay">
      <div class="success-icon">✓</div>
      <h2>GESLAAGD!</h2>
      <p style="color: #8a8f9d; margin-top: 5px; font-size: 0.9rem;">Slot succesvol gekraakt.</p>
      <button class="btn" onclick="resetGame()">Opnieuw Spelen</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('lockCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('successOverlay');

  const totalStages = 4;
  let currentStage = 0;
  
  let angle = 0;
  let speed = 2.5; 
  let targetAngle = 0;
  const targetWidth = 35; // Breedte groene zone (graden)
  let isGameActive = true;

  function initStage() {
    targetAngle = Math.floor(Math.random() * (360 - targetWidth));
  }

  function updateDots() {
    for (let i = 0; i < totalStages; i++) {
      const dot = document.getElementById(`dot-${i}`);
      if (i < currentStage) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 88;

    // Grijze achtergrondcirkel
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#2b303c';
    ctx.lineWidth = 14;
    ctx.stroke();

    // Groene Doelzone
    const startRad = ((targetAngle - 90) * Math.PI) / 180;
    const endRad = (((targetAngle + targetWidth) - 90) * Math.PI) / 180;
    
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, startRad, endRad);
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 14;
    ctx.stroke();

    // Rode Draaiende Naald
    const currentRad = ((angle - 90) * Math.PI) / 180;
    const needleX = centerX + radius * Math.cos(currentRad);
    const needleY = centerY + radius * Math.sin(currentRad);

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(needleX, needleY);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Witte stip in het midden
    ctx.beginPath();
    ctx.arc(centerX, centerY, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    if (isGameActive) {
      angle = (angle + speed) % 360;
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && isGameActive) {
      e.preventDefault();

      // Check of de naald in de groene zone zit
      if (angle >= targetAngle && angle <= (targetAngle + targetWidth)) {
        currentStage++;
        updateDots();

        if (currentStage >= totalStages) {
          isGameActive = false;
          overlay.classList.add('show');
        } else {
          speed += 0.6; // Sneller bij elke stap
          initStage();
        }
      } else {
        // Gefaald: Reset de voortgang
        currentStage = 0;
        speed = 2.5;
        updateDots();
        initStage();
      }
    }
  });

  function resetGame() {
    currentStage = 0;
    speed = 2.5;
    angle = 0;
    isGameActive = true;
    overlay.classList.remove('show');
    updateDots();
    initStage();
  }

  initStage();
  draw();
</script>
