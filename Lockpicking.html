<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockpick Oefening</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1013;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #16181d;
      border: 1px solid #232730;
      border-radius: 16px;
      padding: 30px;
      width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .feedback {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      min-height: 20px;
    }

    .game-area {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
    }

    canvas {
      display: block;
    }

    /* Instructies links-onder */
    .controls-panel {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: rgba(18, 19, 22, 0.8);
      border: 1px solid #232730;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .controls-panel div {
      margin-bottom: 4px;
    }

    kbd {
      background: #232730;
      color: #fbbf24;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }

    /* Overlay scherm */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 16, 19, 0.95);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body onclick="window.focus()">

  <div class="container">
    <div class="header">
      <div class="title">Lockpick Oefening</div>
      <div class="feedback" id="feedbackText"></div>
    </div>

    <div class="game-area">
      <canvas id="lockCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls-panel">
      <div><kbd>Muis</kbd> Beweeg de lockpick</div>
      <div><kbd>A</kbd> <kbd>D</kbd> Zet opening</div>
      <div><kbd>ESC</kbd> Stoppen</div>
    </div>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle" style="color: #22c55e; font-size: 1.8rem; margin-bottom: 10px;">LOCK GEOPEND</h2>
      <p id="overlaySub" style="color: #94a3b8; font-size: 0.9rem;">Goed gedaan!</p>
      <button class="btn" onclick="initGame()">OPNIEUW OEFENEN</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('lockCanvas');
  const ctx = canvas.getContext('2d');
  const feedbackText = document.getElementById('feedbackText');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');

  let isGameActive = false;
  let animFrame = null;
  let startTime = 0;

  // Fysica variabelen
  let pickAngle = 0; // Hoek van de pick (-90 tot 90 deg)
  let targetAngle = 0; // De "sweet spot"
  let cylinderAngle = 0; // Huidige rotatie van de cilinder
  let keyTurning = false;

  function initGame() {
    window.focus();
    overlay.classList.remove('show');
    if (animFrame) cancelAnimationFrame(animFrame);

    isGameActive = true;
    pickAngle = 0;
    cylinderAngle = 0;
    keyTurning = false;
    feedbackText.innerText = "";
    startTime = Date.now();

    // Genereer willekeurige juiste hoek tussen -80 en 80 graden
    targetAngle = (Math.random() * 160) - 80;

    animate();
  }

  // Muisbeweging voor de lockpick
  window.addEventListener('mousemove', (e) => {
    if (!isGameActive) return;
    const rect = canvas.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const rad = Math.atan2(e.clientY - centerY, e.clientX - centerX);
    let deg = rad * (180 / Math.PI) + 90;

    // Beperk hoek
    if (deg > 180) deg -= 360;
    pickAngle = Math.max(-85, Math.min(85, deg));
  });

  // A / D toetsen voor het draaien van de sleutel/opening
  window.addEventListener('keydown', (e) => {
    if (!isGameActive) return;
    if (e.key === 'a' || e.key === 'A' || e.key === 'd' || e.key === 'D') {
      keyTurning = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'A' || e.key === 'd' || e.key === 'D') {
      keyTurning = false;
    }
  });

  function animate() {
    if (!isGameActive) return;

    // Bereken afstand tot de juiste plek
    const diff = Math.abs(pickAngle - targetAngle);
    const tolerance = 12; // Marge waarin de cilinder volledig kan draaien
    const maxCylinder = 90; // Volledig geopend bij 90 graden

    let targetCylinder = 0;

    if (keyTurning) {
      if (diff < tolerance) {
        // Goede positie: Draai helemaal open
        targetCylinder = maxCylinder;
        feedbackText.innerText = "✓ GOEDE POSITIE";
        feedbackText.style.color = "#22c55e";
      } else {
        // Beperkte rotatie gebaseerd op hoe dichtbij je bent
        const allowedPercent = Math.max(0, 1 - (diff / 90));
        targetCylinder = maxCylinder * allowedPercent * 0.4;
        feedbackText.innerText = "⚠ TE VEEL WEERSTAND";
        feedbackText.style.color = "#ef4444";
      }
    } else {
      feedbackText.innerText = "";
    }

    // Soepele overgang
    cylinderAngle += (targetCylinder - cylinderAngle) * 0.2;

    // Check of het slot volledig geopend is
    if (cylinderAngle >= 88) {
      isGameActive = false;
      feedbackText.innerText = "";
      const timeTaken = ((Date.now() - startTime) / 1000).toFixed(1);
      
      overlayTitle.innerText = "LOCK GEOPEND";
      overlayTitle.style.color = "#22c55e";
      overlaySub.innerText = `Goed gedaan! Je hebt het slot geopend in ${timeTaken}s.`;
      
      cancelAnimationFrame(animFrame);
      overlay.classList.add('show');
      return;
    }

    draw();
    animFrame = requestAnimationFrame(animate);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // 1. Buitenste Behuizing
    ctx.beginPath();
    ctx.arc(cx, cy, 120, 0, Math.PI * 2);
    ctx.fillStyle = '#232730';
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(cylinderAngle * Math.PI / 180);

    // 2. Draaiende Cilinder
    ctx.beginPath();
    ctx.arc(0, 0, 80, 0, Math.PI * 2);
    ctx.fillStyle = '#3b4252';
    ctx.fill();

    // Sleutelgat
    ctx.beginPath();
    ctx.rect(-6, -10, 12, 40);
    ctx.fillStyle = '#0f1013';
    ctx.fill();

    ctx.restore();

    // 3. Lockpick Naald
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(pickAngle * Math.PI / 180);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -100);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Rood handvat onderaan
    ctx.beginPath();
    ctx.arc(0, 110, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444';
    ctx.fill();

    ctx.restore();
  }

  initGame();
</script>

</body>
</html>
