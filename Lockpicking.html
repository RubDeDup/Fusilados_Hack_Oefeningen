<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockpicking Minigame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #161922;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 420px;
      position: relative;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #8a8f9d;
      margin-bottom: 20px;
    }

    /* Lockpick Circle Area */
    .lock-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 20px auto;
    }

    canvas {
      background-color: #12141c;
      border-radius: 50%;
      border: 4px solid #232730;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      display: block;
    }

    /* Voortgangsbolletjes */
    .stages {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .stage-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #2b303c;
      border: 2px solid #3b4252;
      transition: all 0.2s ease;
    }

    .stage-dot.active {
      background-color: #fbbf24;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    .stage-dot.completed {
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-bar {
      font-size: 0.9rem;
      color: #a0a5b5;
      min-height: 24px;
    }

    kbd {
      background: #2b303c;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.85rem;
    }

    /* Overlay scherm */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 25, 34, 0.96);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body onclick="window.focus()">

  <div class="container">
    <h1>LOCKPICKING</h1>
    <p class="subtitle">Druk op <kbd>SPATIE</kbd> in de groene zone</p>

    <div class="lock-container">
      <canvas id="lockCanvas" width="260" height="260"></canvas>
    </div>

    <div class="stages">
      <div class="stage-dot active" id="dot1"></div>
      <div class="stage-dot" id="dot2"></div>
      <div class="stage-dot" id="dot3"></div>
      <div class="stage-dot" id="dot4"></div>
    </div>

    <div class="status-bar" id="status">Fase 1 van 4</div>

    <!-- Overlay Scherm -->
    <div class="overlay" id="overlay">
      <div class="status-icon" id="statusIcon">✓</div>
      <h2 id="overlayTitle" style="color: #22c55e;">SLOT GEKRAAKT!</h2>
      <p id="overlaySub" style="color: #94a3b8; margin-top: 5px; font-size: 0.85rem;">Alle fases succesvol doorlopen.</p>
      <button class="btn" onclick="startGame()">Opnieuw Proberen</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('lockCanvas');
  const ctx = canvas.getContext('2d');
  const statusText = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const statusIcon = document.getElementById('statusIcon');

  const totalStages = 4;
  let currentStage = 1;
  let isGameActive = false;
  let animId = null;

  let angle = 0;
  let speed = 0.04;
  let zoneStart = 0;
  let zoneSize = 0.5; // In radialen (~30 graden)

  function setRandomZone() {
    // Genereer groene zone op een willekeurige plek in de cirkel
    zoneStart = Math.random() * (Math.PI * 2 - zoneSize);
  }

  function startGame() {
    window.focus();
    overlay.classList.remove('show');
    if (animId) cancelAnimationFrame(animId);

    currentStage = 1;
    isGameActive = true;
    angle = 0;
    speed = 0.04;

    updateDots();
    setRandomZone();
    statusText.innerText = "Fase 1 van 4";

    animate();
  }

  function updateDots() {
    for (let i = 1; i <= totalStages; i++) {
      const dot = document.getElementById(`dot${i}`);
      dot.className = 'stage-dot';
      if (i < currentStage) {
        dot.classList.add('completed');
      } else if (i === currentStage) {
        dot.classList.add('active');
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 95;

    // 1. Cirkel achtergrond spoor
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#1e222d';
    ctx.lineWidth = 14;
    ctx.stroke();

    // 2. Groene Hit-Zone
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, zoneStart, zoneStart + zoneSize);
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 14;
    ctx.stroke();

    // 3. Draaiende Naald (Rood)
    const needleX = centerX + Math.cos(angle) * radius;
    const needleY = centerY + Math.sin(angle) * radius;

    ctx.beginPath();
    ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(needleX, needleY);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  function animate() {
    if (!isGameActive) return;

    angle += speed;
    if (angle >= Math.PI * 2) {
      angle -= Math.PI * 2;
    }

    draw();
    animId = requestAnimationFrame(animate);
  }

  function checkHit() {
    if (!isGameActive) return;

    // Normaliseer hoek tussen 0 en 2*PI
    let normalizedAngle = angle % (Math.PI * 2);
    if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

    const inZone = normalizedAngle >= zoneStart && normalizedAngle <= (zoneStart + zoneSize);

    if (inZone) {
      // Goed geklikt!
      currentStage++;
      updateDots();

      if (currentStage > totalStages) {
        // GEWONNEN: Stop animatie direct om "spacen" te voorkomen
        isGameActive = false;
        cancelAnimationFrame(animId);
        showEndScreen(true, "SLOT GEKRAAKT!", "Alle 4 de fases succesvol doorlopen.");
      } else {
        // Volgende fase: Snelheid verhogen
        speed += 0.015;
        setRandomZone();
        statusText.innerText = `Fase ${currentStage} van 4`;
      }
    } else {
      // MISLUKT: Stop animatie
      isGameActive = false;
      cancelAnimationFrame(animId);
      showEndScreen(false, "LOCKPICK GEBROKEN!", "Je sloeg op het verkeerde moment.");
    }
  }

  function showEndScreen(success, title, sub) {
    statusIcon.innerText = success ? "✓" : "✕";
    statusIcon.style.color = success ? "#22c55e" : "#ef4444";
    overlayTitle.innerText = title;
    overlayTitle.style.color = success ? "#22c55e" : "#ef4444";
    overlaySub.innerText = sub;

    setTimeout(() => overlay.classList.add('show'), 200);
  }

  // Luister naar Spatiewaarde en Muisklik
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      checkHit();
    }
  });

  canvas.addEventListener('click', () => {
    checkHit();
  });

  startGame();
</script>

</body>
</html>
