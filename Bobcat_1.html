<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobcat 1 Hack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: #161922;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 420px;
      position: relative;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #8a8f9d;
      margin-bottom: 20px;
    }

    /* Board (6 pogingen x 5 cijfers) */
    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .tile {
      width: 55px;
      height: 55px;
      background-color: #1e222d;
      border: 2px solid #2b303c;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      user-select: none;
      transition: all 0.2s ease;
    }

    .tile.correct {
      background-color: #22c55e !important;
      border-color: #22c55e !important;
    }

    .tile.present {
      background-color: #eab308 !important;
      border-color: #eab308 !important;
    }

    .tile.absent {
      background-color: #334155 !important;
      border-color: #334155 !important;
      color: #64748b;
    }

    /* Keypad (0-9) */
    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .key {
      background-color: #2b303c;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .key:hover {
      background-color: #384152;
    }

    .key.correct { background-color: #22c55e !important; }
    .key.present { background-color: #eab308 !important; }
    .key.absent { background-color: #1e293b !important; color: #475569; }

    /* Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 25, 34, 0.96);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .secret-display {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-top: 10px;
      font-family: monospace;
      letter-spacing: 3px;
      background: #0d0e12;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #2b303c;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }

    .watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>

<body onclick="window.focus()">

  <div class="container">
    <h1>BOBCAT 1 HACK</h1>
    <p class="subtitle">Raad de 5-cijferige combinatie</p>

    <div class="board" id="board"></div>

    <div class="keypad">
      <button class="key" onclick="handleInput('1')">1</button>
      <button class="key" onclick="handleInput('2')">2</button>
      <button class="key" onclick="handleInput('3')">3</button>
      <button class="key" onclick="handleInput('4')">4</button>
      <button class="key" onclick="handleInput('5')">5</button>
      <button class="key" onclick="handleInput('6')">6</button>
      <button class="key" onclick="handleInput('7')">7</button>
      <button class="key" onclick="handleInput('8')">8</button>
      <button class="key" onclick="handleInput('9')">9</button>
      <button class="key" onclick="handleInput('0')">0</button>
      <button class="key" style="grid-column: span 2;" onclick="handleInput('Backspace')">⌫ Wis</button>
      <button class="key" style="grid-column: span 3; background-color: #0284c7;" onclick="handleInput('Enter')">ENTER</button>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
      <div class="status-icon" id="statusIcon">✓</div>
      <h2 id="overlayTitle" style="color: #22c55e;">CODE GEKRAAKT!</h2>
      <div class="secret-display" id="secretDisplay">Code: -----</div>
      <button class="btn" onclick="startGame()">Opnieuw Spelen</button>
    </div>
  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const secretDisplay = document.getElementById('secretDisplay');
  const statusIcon = document.getElementById('statusIcon');

  const wordLength = 5;
  const maxAttempts = 6;

  let secretCode = [];
  let currentAttempt = 0;
  let currentGuess = [];
  let isGameActive = false;

  function createBoard() {
    board.innerHTML = '';
    for (let r = 0; r < maxAttempts; r++) {
      const row = document.createElement('div');
      row.classList.add('row');
      row.dataset.row = r;

      for (let c = 0; c < wordLength; c++) {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.dataset.col = c;
        row.appendChild(tile);
      }
      board.appendChild(row);
    }
  }

  function startGame() {
    window.focus();
    overlay.classList.remove('show');
    currentAttempt = 0;
    currentGuess = [];
    isGameActive = true;

    secretCode = [];
    for (let i = 0; i < wordLength; i++) {
      secretCode.push(Math.floor(Math.random() * 10).toString());
    }

    createBoard();

    document.querySelectorAll('.key').forEach(k => {
      k.classList.remove('correct', 'present', 'absent');
    });
  }

  function handleInput(key) {
    if (!isGameActive) return;

    if (key >= '0' && key <= '9') {
      if (currentGuess.length < wordLength) {
        currentGuess.push(key);
        updateRow();
      }
    } else if (key === 'Backspace' || key === 'Delete') {
      if (currentGuess.length > 0) {
        currentGuess.pop();
        updateRow();
      }
    } else if (key === 'Enter') {
      if (currentGuess.length === wordLength) {
        checkGuess();
      }
    }
  }

  function updateRow() {
    const rowTiles = board.children[currentAttempt].children;
    for (let i = 0; i < wordLength; i++) {
      rowTiles[i].innerText = currentGuess[i] || '';
    }
  }

  function checkGuess() {
    const rowTiles = board.children[currentAttempt].children;
    const codeCopy = [...secretCode];
    const result = Array(wordLength).fill('absent');

    for (let i = 0; i < wordLength; i++) {
      if (currentGuess[i] === secretCode[i]) {
        result[i] = 'correct';
        codeCopy[i] = null;
      }
    }

    for (let i = 0; i < wordLength; i++) {
      if (result[i] !== 'correct') {
        const foundIndex = codeCopy.indexOf(currentGuess[i]);
        if (foundIndex !== -1) {
          result[i] = 'present';
          codeCopy[foundIndex] = null;
        }
      }
    }

    for (let i = 0; i < wordLength; i++) {
      const tile = rowTiles[i];
      const val = currentGuess[i];
      tile.classList.add(result[i]);

      const keyBtns = document.querySelectorAll('.key');
      keyBtns.forEach(k => {
        if (k.innerText === val) {
          if (result[i] === 'correct') {
            k.className = 'key correct';
          } else if (result[i] === 'present' && !k.classList.contains('correct')) {
            k.className = 'key present';
          } else if (result[i] === 'absent' && !k.classList.contains('correct') && !k.classList.contains('present')) {
            k.className = 'key absent';
          }
        }
      });
    }

    if (currentGuess.join('') === secretCode.join('')) {
      showEndScreen(true, "CODE GEKRAAKT!", `Juiste code: ${secretCode.join('')}`);
    } else {
      currentAttempt++;
      currentGuess = [];

      if (currentAttempt >= maxAttempts) {
        showEndScreen(false, "MISLUKT!", `Juiste code was: ${secretCode.join('')}`);
      }
    }
  }

  function showEndScreen(success, title, subText) {
    isGameActive = false;
    statusIcon.innerText = success ? "✓" : "✕";
    statusIcon.style.color = success ? "#22c55e" : "#ef4444";
    overlayTitle.innerText = title;
    overlayTitle.style.color = success ? "#22c55e" : "#ef4444";
    secretDisplay.innerText = subText;

    setTimeout(() => overlay.classList.add('show'), 500);
  }

  window.addEventListener('keydown', (e) => {
    handleInput(e.key);
  });

  startGame();
</script>

</body>
</html>
