<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winkel DVD Hack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: #161922;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 580px;
      position: relative;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #8a8f9d;
      margin-bottom: 15px;
    }

    #gameCanvas {
      background-color: #0b0c10;
      border: 2px solid #232730;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }

    .status-bar {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #a0a5b5;
      min-height: 24px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 25, 34, 0.96);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .vault-code {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-top: 10px;
      font-family: monospace;
      letter-spacing: 2px;
      background: #0d0e12;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #2b303c;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }

    .watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>WINKEL DVD HACK</h1>
    <p class="subtitle">Onthoud de nummers van de stuiterende blokjes</p>

    <canvas id="gameCanvas" width="520" height="320"></canvas>

    <div class="status-bar" id="status">Onthoud de nummers...</div>

    <div class="overlay" id="overlay">
      <div class="status-icon" id="statusIcon">✓</div>
      <h2 id="overlayTitle" style="color: #22c55e;">GESLAAGD!</h2>
      <div class="vault-code" id="vaultCodeText">Code van de kluis: ----</div>
      <button class="btn" onclick="startGame()">Opnieuw Spelen</button>
    </div>
  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const statusText = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('vaultCodeText');
  const statusIcon = document.getElementById('statusIcon');

  const boxSize = 50;
  const totalBoxes = 3;
  
  let boxes = [];
  let nextExpected = 1;
  let phase = 'MEMORIZE';
  let animationFrameId;

  function startGame() {
    overlay.classList.remove('show');
    nextExpected = 1;
    phase = 'MEMORIZE';
    statusText.innerText = "Onthoud de nummers van de blokjes!";

    boxes = [];
    for (let i = 1; i <= totalBoxes; i++) {
      boxes.push({
        number: i,
        x: Math.random() * (canvas.width - boxSize - 40) + 20,
        y: Math.random() * (canvas.height - boxSize - 40) + 20,
        dx: (Math.random() < 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.6),
        dy: (Math.random() < 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.6),
        clicked: false
      });
    }

    setTimeout(() => {
      phase = 'MOVE_HIDDEN';
      statusText.innerText = "Blijf de blokjes volgen...";

      setTimeout(() => {
        phase = 'CLICK';
        statusText.innerText = "Klik op de blokjes in volgorde (1 ➔ 2 ➔ 3)!";
      }, 2000);

    }, 2500);

    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animate();
  }

  function updatePositions() {
    boxes.forEach(box => {
      if (phase === 'MEMORIZE' || phase === 'MOVE_HIDDEN') {
        box.x += box.dx;
        box.y += box.dy;

        if (box.x <= 0 || box.x + boxSize >= canvas.width) box.dx *= -1;
        if (box.y <= 0 || box.y + boxSize >= canvas.height) box.dy *= -1;
      }
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    boxes.forEach(box => {
      ctx.fillStyle = box.clicked ? '#22c55e' : '#3b5998';
      ctx.beginPath();
      ctx.roundRect(box.x, box.y, boxSize, boxSize, 8);
      ctx.fill();

      ctx.strokeStyle = box.clicked ? '#ffffff' : '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (phase === 'MEMORIZE' || box.clicked) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(box.number, box.x + boxSize / 2, box.y + boxSize / 2);
      }
    });
  }

  function animate() {
    updatePositions();
    draw();
    animationFrameId = requestAnimationFrame(animate);
  }

  canvas.addEventListener('click', (e) => {
    if (phase !== 'CLICK') return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    boxes.forEach(box => {
      if (!box.clicked && 
          clickX >= box.x && clickX <= box.x + boxSize &&
          clickY >= box.y && clickY <= box.y + boxSize) {

        if (box.number === nextExpected) {
          box.clicked = true;
          nextExpected++;

          if (nextExpected > totalBoxes) {
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            showEndScreen(true, "GESLAAGD!", `Code van de kluis: ${randomCode}`);
          }
        } else {
          showEndScreen(false, "MISLUKT!", "Verkeerde volgorde geklikt.");
        }
      }
    });
  });

  function showEndScreen(success, title, subText) {
    statusIcon.innerText = success ? "✓" : "✕";
    statusIcon.style.color = success ? "#22c55e" : "#ef4444";
    overlayTitle.innerText = title;
    overlayTitle.style.color = success ? "#22c55e" : "#ef4444";
    overlaySub.innerText = subText;
    
    setTimeout(() => overlay.classList.add('show'), 300);
  }

  startGame();
</script>

</body>
</html>
