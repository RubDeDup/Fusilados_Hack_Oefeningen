<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados hub - Financiën</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f1013; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 1100px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #fbbf24; }
    .back-btn { background: #16181d; border: 1px solid #232730; color: #94a3b8; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .back-btn:hover { color: #fbbf24; border-color: #fbbf24; }

    /* BALANS CARDS */
    .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .balance-card { background: #16181d; border: 1px solid #232730; border-radius: 14px; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .balance-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    .balance-amount { font-size: 1.8rem; font-weight: 800; }
    .balance-amount.white { color: #38bdf8; }
    .balance-amount.black { color: #ef4444; }
    .balance-amount.total { color: #22c55e; }

    .card { background-color: #16181d; border: 1px solid #232730; border-radius: 14px; padding: 28px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .card h2 { font-size: 1.2rem; color: #ffffff; margin-bottom: 20px; }

    /* INVOERFORMULIER GRID */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr auto; gap: 14px; align-items: end; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; background: #0f1013; border: 1px solid #232730; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
    .form-group select option { background: #16181d; color: #fff; }
    .form-group input:focus, .form-group select:focus { border-color: #fbbf24; }
    
    .btn-deposit { padding: 12px 24px; background: #22c55e; color: #0f1013; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    .btn-withdraw { padding: 12px 24px; background: #ef4444; color: #ffffff; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }

    /* TABEL OVERZICHT */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid #232730; font-size: 0.9rem; }
    th { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }

    .badge-deposit { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-withdraw { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    
    .money-white { color: #38bdf8; font-weight: bold; }
    .money-black { color: #ef4444; font-weight: bold; }

    .watermark { position: fixed; bottom: 15px; right: 20px; font-size: 0.75rem; color: #475569; pointer-events: none; }
  </style>
</head>
<body>

  <div class="container">

    <div class="header-bar">
      <div class="section-title">💰 BENDE FINANCIËN</div>
      <button class="back-btn" onclick="goToKruispunt()">← Terug naar Kruispunt</button>
    </div>

    <!-- TOTAAL SALDO CARDS (Alleen voor Higher Gringo & Opper Gringo) -->
    <div class="balance-grid" id="balanceCardsGrid" style="display: none;">
      <div class="balance-card">
        <div class="balance-title">💵 Wit Geld Kas</div>
        <div class="balance-amount white" id="whiteBalanceDisplay">€ 0</div>
      </div>
      <div class="balance-card">
        <div class="balance-title">🕶️ Zwart Geld Kas</div>
        <div class="balance-amount black" id="blackBalanceDisplay">€ 0</div>
      </div>
      <div class="balance-card">
        <div class="balance-title">🏦 Totale Bende Kapitaal</div>
        <div class="balance-amount total" id="totalBalanceDisplay">€ 0</div>
      </div>
    </div>

    <!-- STORTEN FORMULIER (VOOR IEDEREEN) -->
    <div class="card">
      <h2>📥 Geld Storten In De Kas</h2>
      <form onsubmit="handleDeposit(event)" class="form-grid">
        <div class="form-group">
          <label>Bedrag (€)</label>
          <input type="number" id="depositAmount" min="1" required placeholder="bijv. 50000">
        </div>

        <div class="form-group">
          <label>Type Geld</label>
          <select id="depositMoneyType" required>
            <option value="Wit">Wit Geld 💵</option>
            <option value="Zwart">Zwart Geld 🕶️</option>
          </select>
        </div>

        <div class="form-group">
          <label>Opmerking / Herkomst</label>
          <input type="text" id="depositNotes" placeholder="bijv. Overval buit / Donatie">
        </div>

        <button type="submit" class="btn-deposit">+ Geld Storten</button>
      </form>
    </div>

    <!-- OPNEMEN FORMULIER (ALLEEN VOOR OPPER GRINGO) -->
    <div class="card" id="withdrawCard" style="display: none;">
      <h2>📤 Geld Opnemen Uit De Kas (Admin)</h2>
      <form onsubmit="handleWithdraw(event)" class="form-grid">
        <div class="form-group">
          <label>Bedrag (€)</label>
          <input type="number" id="withdrawAmount" min="1" required placeholder="bijv. 25000">
        </div>

        <div class="form-group">
          <label>Type Geld</label>
          <select id="withdrawMoneyType" required>
            <option value="Wit">Wit Geld 💵</option>
            <option value="Zwart">Zwart Geld 🕶️</option>
          </select>
        </div>

        <div class="form-group">
          <label>Reden Van Opname</label>
          <input type="text" id="withdrawNotes" required placeholder="bijv. Aankoop Bende Huis">
        </div>

        <button type="submit" class="btn-withdraw">- Geld Opnemen</button>
      </form>
    </div>

    <!-- TRANSACTIE LOGBOEK -->
    <div class="card">
      <h2>📜 Transactie Logboek</h2>
      <table>
        <thead>
          <tr>
            <th>Datum / Tijd</th>
            <th>Lid</th>
            <th>Type Actie</th>
            <th>Soort Geld</th>
            <th>Bedrag</th>
            <th>Opmerking / Reden</th>
          </tr>
        </thead>
        <tbody id="transactionsTableBody">
          <tr><td colspan="6" style="color: #94a3b8;">Laden van transacties...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const SUPABASE_URL = "https://suimuvzfrhtqxprzzojy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LTp-t_e2PX8kF-L-Du1dDw_cY9QNfKJ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const currentUser = sessionStorage.getItem("currentUser") || "Onbekend";
  const currentRole = sessionStorage.getItem("currentRole") || "Gringo";

  const isHigherGringoOrAdmin = (currentRole === "Opper Gringo" || currentRole === "Higher Gringo");
  const isOpperGringo = (currentRole === "Opper Gringo");

  // Rechten toepassen op UI
  if (isHigherGringoOrAdmin) {
    document.getElementById("balanceCardsGrid").style.display = "grid";
  }

  if (isOpperGringo) {
    document.getElementById("withdrawCard").style.display = "block";
  }

  async function loadFinances() {
    const tbody = document.getElementById("transactionsTableBody");
    const { data, error } = await _supabase
      .from('gang_finances')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !data) {
      tbody.innerHTML = "<tr><td colspan='6' style='color:#ef4444;'>Fout bij laden van financiële gegevens!</td></tr>";
      return;
    }

    if (data.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6' style='color:#64748b;'>Nog geen transacties geregistreerd.</td></tr>";
      return;
    }

    let whiteTotal = 0;
    let blackTotal = 0;

    tbody.innerHTML = "";
    data.forEach(item => {
      const date = new Date(item.created_at).toLocaleString('nl-NL');
      const amountNum = parseFloat(item.amount || 0);

      // Balans berekenen
      if (item.transaction_type === 'Storting') {
        if (item.money_type === 'Wit') whiteTotal += amountNum;
        if (item.money_type === 'Zwart') blackTotal += amountNum;
      } else if (item.transaction_type === 'Opname') {
        if (item.money_type === 'Wit') whiteTotal -= amountNum;
        if (item.money_type === 'Zwart') blackTotal -= amountNum;
      }

      const tr = document.createElement("tr");
      const actionBadge = item.transaction_type === 'Storting' ? 
        `<span class="badge-deposit">+ Storting</span>` : 
        `<span class="badge-withdraw">- Opname</span>`;

      const moneyClass = item.money_type === 'Wit' ? 'money-white' : 'money-black';

      tr.innerHTML = `
        <td style="color:#94a3b8; font-size:0.8rem;">${date}</td>
        <td><strong>${item.username}</strong></td>
        <td>${actionBadge}</td>
        <td><span class="${moneyClass}">${item.money_type} Geld</span></td>
        <td><strong>€ ${amountNum.toLocaleString('nl-NL')}</strong></td>
        <td style="color:#94a3b8;">${item.notes || '-'}</td>
      `;
      tbody.appendChild(tr);
    });

    // Update Saldo Weergave voor Beheerders
    if (isHigherGringoOrAdmin) {
      document.getElementById("whiteBalanceDisplay").innerText = "€ " + whiteTotal.toLocaleString('nl-NL');
      document.getElementById("blackBalanceDisplay").innerText = "€ " + blackTotal.toLocaleString('nl-NL');
      document.getElementById("totalBalanceDisplay").innerText = "€ " + (whiteTotal + blackTotal).toLocaleString('nl-NL');
    }
  }

  async function handleDeposit(e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById("depositAmount").value);
    const money_type = document.getElementById("depositMoneyType").value;
    const notes = document.getElementById("depositNotes").value.trim();

    const { error } = await _supabase.from('gang_finances').insert([{
      username: currentUser,
      transaction_type: 'Storting',
      money_type,
      amount,
      notes
    }]);

    if (error) {
      alert("Fout bij storten: " + error.message);
      return;
    }

    document.getElementById("depositAmount").value = "";
    document.getElementById("depositNotes").value = "";
    alert("Geld succesvol gestort!");
    loadFinances();
  }

  async function handleWithdraw(e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById("withdrawAmount").value);
    const money_type = document.getElementById("withdrawMoneyType").value;
    const notes = document.getElementById("withdrawNotes").value.trim();

    const { error } = await _supabase.from('gang_finances').insert([{
      username: currentUser,
      transaction_type: 'Opname',
      money_type,
      amount,
      notes
    }]);

    if (error) {
      alert("Fout bij opnemen: " + error.message);
      return;
    }

    document.getElementById("withdrawAmount").value = "";
    document.getElementById("withdrawNotes").value = "";
    alert("Geld succesvol opgenomen!");
    loadFinances();
  }

  function goToKruispunt() {
    if (window.parent && window.parent.openHome) {
      window.parent.openHome();
    } else {
      window.location.href = 'Home.html';
    }
  }

  loadFinances();
</script>

</body>
</html>
