<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados hub - Wiet Ingave</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1013;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #22c55e;
    }

    .back-btn {
      background: #16181d;
      border: 1px solid #232730;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #22c55e;
      border-color: #22c55e;
    }

    .card {
      background-color: #16181d;
      border: 1px solid #232730;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card h2 {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* INVOERFORMULIER GRID */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr auto;
      gap: 16px;
      align-items: end;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: #0f1013;
      border: 1px solid #232730;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group select option {
      background: #16181d;
      color: #fff;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #22c55e;
    }

    .btn-submit {
      padding: 12px 24px;
      background: #22c55e;
      color: #0f1013;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #16a34a;
    }

    /* TABEL OVERZICHT */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #232730;
      font-size: 0.9rem;
    }

    th {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .strain-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .gram-badge {
      font-weight: bold;
      color: #fbbf24;
    }

    .btn-delete {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .watermark {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header-bar">
      <div class="section-title">🌿 WIET INGAVE SYSTEEM</div>
      <button class="back-btn" onclick="goToKruispunt()">← Terug naar Kruispunt</button>
    </div>

    <!-- Invoer Formulier Card -->
    <div class="card">
      <h2>📝 Nieuwe Oogst / Ingave Registreren</h2>
      <form onsubmit="submitEntry(event)" class="form-grid">
        
        <div class="form-group">
          <label>Soort Wiet (Strain)</label>
          <select id="strainSelect" required>
            <option value="Amnesia Haze">Amnesia Haze</option>
            <option value="Northern Lights">Northern Lights</option>
            <option value="Gelato #33">Gelato #33</option>
            <option value="OG Kush">OG Kush</option>
            <option value="Super Silver Haze">Super Silver Haze</option>
            <option value="White Widow">White Widow</option>
            <option value="Gorilla Glue">Gorilla Glue</option>
            <option value="Overig">Overig</option>
          </select>
        </div>

        <div class="form-group">
          <label>Aantal Gram</label>
          <input type="number" id="gramInput" min="1" required placeholder="bijv. 50">
        </div>

        <div class="form-group">
          <label>Opmerking / Locatie (Optioneel)</label>
          <input type="text" id="notesInput" placeholder="bijv. Oogst Loods A">
        </div>

        <button type="submit" class="btn-submit">+ Opslaan</button>
      </form>
    </div>

    <!-- Live Voorraad Tabel Card -->
    <div class="card">
      <h2>📊 Live Oogst & Voorraad Overzicht</h2>
      <table>
        <thead>
          <tr>
            <th>Datum / Tijd</th>
            <th>Kweker / Lid</th>
            <th>Soort Wiet</th>
            <th>Gewicht</th>
            <th>Opmerking</th>
            <th>Acties</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <tr><td colspan="6" style="color: #94a3b8;">Laden van voorraad...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const SUPABASE_URL = "https://suimuvzfrhtqxprzzojy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LTp-t_e2PX8kF-L-Du1dDw_cY9QNfKJ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const currentUser = sessionStorage.getItem("currentUser") || "Onbekend";
  const currentRole = sessionStorage.getItem("currentRole") || "Gringo";

  async function loadInventory() {
    const tbody = document.getElementById("inventoryTableBody");
    const { data, error } = await _supabase
      .from('wiet_inventory')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !data) {
      tbody.innerHTML = "<tr><td colspan='6' style='color:#ef4444;'>Fout bij laden van de gegevens!</td></tr>";
      return;
    }

    if (data.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6' style='color:#64748b;'>Nog geen ingaves geregistreerd.</td></tr>";
      return;
    }

    tbody.innerHTML = "";
    data.forEach((item) => {
      const date = new Date(item.created_at).toLocaleString('nl-NL');
      const tr = document.createElement("tr");

      const isOwnerOrAdmin = (item.username === currentUser) || (currentRole === "Opper Gringo");

      tr.innerHTML = `
        <td style="color:#94a3b8; font-size:0.8rem;">${date}</td>
        <td><strong>${item.username}</strong></td>
        <td><span class="strain-badge">${item.strain}</span></td>
        <td><span class="gram-badge">${item.amount_grams}g</span></td>
        <td style="color:#94a3b8;">${item.notes || '-'}</td>
        <td>
          ${isOwnerOrAdmin ? `<button class="btn-delete" onclick="deleteEntry(${item.id})">Verwijderen</button>` : '-'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function submitEntry(e) {
    e.preventDefault();
    const strain = document.getElementById("strainSelect").value;
    const amount_grams = parseInt(document.getElementById("gramInput").value);
    const notes = document.getElementById("notesInput").value.trim();

    const { error } = await _supabase
      .from('wiet_inventory')
      .insert([{ username: currentUser, strain, amount_grams, notes }]);

    if (error) {
      alert("Fout bij opslaan: " + error.message);
      return;
    }

    document.getElementById("gramInput").value = "";
    document.getElementById("notesInput").value = "";
    loadInventory();
  }

  async function deleteEntry(id) {
    if (confirm("Weet je zeker dat je deze ingave wilt verwijderen?")) {
      await _supabase.from('wiet_inventory').delete().eq('id', id);
      loadInventory();
    }
  }

  function goToKruispunt() {
    if (window.parent && window.parent.openHome) {
      window.parent.openHome();
    } else {
      window.location.href = 'Home.html';
    }
  }

  loadInventory();
</script>

</body>
</html>
