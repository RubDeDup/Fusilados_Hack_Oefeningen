<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRUTEFORCE - Word Hack</title>
  <link rel="icon" type="image/png" href="fusilados.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #08090b; color: #38bdf8; font-family: 'Courier New', Courier, monospace; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    .laptop-frame { width: 800px; background: #0f172a; border: 2px solid #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    .header-title { text-align: center; color: #38bdf8; font-size: 1.8rem; font-weight: 900; letter-spacing: 0.1em; margin-bottom: 2px; }
    .header-sub { text-align: center; color: #64748b; font-size: 0.75rem; letter-spacing: 0.2em; margin-bottom: 20px; }

    .timer-bar { text-align: center; font-size: 1.4rem; font-weight: bold; color: #fbbf24; margin-bottom: 20px; }

    .matrix-container { display: flex; justify-content: center; gap: 10px; background: #020617; padding: 24px 16px; border-radius: 8px; border: 1px solid #1e293b; margin-bottom: 20px; position: relative; }

    .column { width: 66px; height: 260px; overflow: hidden; background: #090d16; border: 1px solid #1e293b; border-radius: 6px; position: relative; }

    .column.active { border-color: #fbbf24; box-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }

    .letter-strip { display: flex; flex-direction: column; align-items: center; position: absolute; left: 0; width: 100%; top: 0; }

    /* NORMALE LETTERS */
    .letter { width: 66px; height: 52px; display: flex; justify-content: center; align-items: center; font-size: 1.7rem; font-weight: 700; color: #334155; }

    /* ENKEL DE DOEL-LETTER DIE GEZOCHT MOET WORDEN IS ORANJE */
    .letter.target-seek { 
      color: #f97316 !important; 
      text-shadow: 0 0 8px #f97316, 0 0 15px #ea580c !important; 
      font-weight: 900;
    }

    /* DE HORIZONTALE TARGET SELECTIEBALK */
    .target-box { position: absolute; top: 128px; left: 0; right: 0; height: 52px; border-top: 2px solid #ef4444; border-bottom: 2px solid #ef4444; background: rgba(239, 68, 68, 0.12); pointer-events: none; z-index: 10; }

    /* FEL GROENE LICHTGEVENDE LETTER BIJ BEVESTIGING */
    .column.locked .target-letter { 
      color: #22c55e !important; 
      text-shadow: 0 0 12px #22c55e, 0 0 25px #4ade80, 0 0 35px #15803d !important; 
      font-size: 2.1rem; 
      font-weight: 900;
    }

    .instructions { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: 14px; }
    .btn-action { display: block; margin: 16px auto 0; padding: 10px 24px; background: #38bdf8; color: #020617; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .btn-action:hover { background: #0284c7; color: #fff; }

    .status-msg { text-align: center; font-size: 1.2rem; font-weight: bold; height: 30px; margin-top: 10px; }
    .success { color: #22c55e; }
    .failed { color: #ef4444; }
  </style>
</head>
<body>

  <div class="laptop-frame">
    <div class="header-title">⚡ BRUTEFORCE ⚡</div>
    <div class="header-sub">- BUSTING THROUGH THE BACKDOOR SINCE 1998 -</div>

    <div class="timer-bar" id="timerDisplay">00:08:000</div>

    <div class="matrix-container">
      <div class="target-box"></div>
      <div id="matrixGrid" style="display: flex; gap: 10px;"></div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
    <div class="instructions">Druk op <strong>SPATIEBALK</strong> of <strong>ENTER</strong> wanneer de juiste letter in het rode vak staat!</div>
    <button class="btn-action" onclick="startGame()">▶ Opnieuw Starten</button>
  </div>

<script>
  const TARGET_WORD = "5HUIZEN?";
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789?";
  const ITEM_HEIGHT = 52;
  const TARGET_BOX_Y = 104;
  
  let currentColIndex = 0;
  let timerInterval = null;
  let animFrameId = null;
  let timeLeft = 8000;
  let isPlaying = false;
  
  let columnsData = [];

  // MINDER VARIATIE: Slechts 5 karakters per lijst voor snelle herhaling
  function generateUniqueLetterList(targetChar, length = 5) {
    let list = [targetChar];
    const availableChars = ALPHABET.split('').filter(c => c !== targetChar);
    
    for (let i = availableChars.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [availableChars[i], availableChars[j]] = [availableChars[j], availableChars[i]];
    }

    for (let i = 0; i < length - 1; i++) {
      list.push(availableChars[i]);
    }

    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }

    return list;
  }

  function startGame() {
    clearInterval(timerInterval);
    if (animFrameId) cancelAnimationFrame(animFrameId);
    
    columnsData = [];
    currentColIndex = 0;
    timeLeft = 8000;
    isPlaying = true;

    document.getElementById("statusMsg").innerText = "";
    document.getElementById("statusMsg").className = "status-msg";

    const grid = document.getElementById("matrixGrid");
    grid.innerHTML = "";

    for (let i = 0; i < TARGET_WORD.length; i++) {
      const targetChar = TARGET_WORD[i];
      const col = document.createElement("div");
      col.className = `column ${i === 0 ? 'active' : ''}`;
      col.id = `col-${i}`;

      const strip = document.createElement("div");
      strip.className = "letter-strip";
      strip.id = `strip-${i}`;

      const baseLetters = generateUniqueLetterList(targetChar, 5);
      const fullList = [...baseLetters, ...baseLetters];

      fullList.forEach((char) => {
        const lDiv = document.createElement("div");
        lDiv.className = "letter";
        if (char === targetChar) {
          lDiv.classList.add("target-seek");
        }
        lDiv.innerText = char;
        strip.appendChild(lDiv);
      });

      col.appendChild(strip);
      grid.appendChild(col);

      columnsData.push({
        element: strip,
        colElement: col,
        pos: 0,
        speed: 3.2 + (i * 0.4),
        isLocked: false,
        letters: fullList,
        listLength: baseLetters.length
      });
    }

    startAnimationLoop();
    startTimer();
  }

  function startAnimationLoop() {
    let lastTime = performance.now();

    function update(now) {
      if (!isPlaying) return;

      const delta = (now - lastTime) / 16.66;
      lastTime = now;

      columnsData.forEach((col) => {
        if (!col.isLocked) {
          col.pos -= col.speed * delta;
          const maxScroll = col.listLength * ITEM_HEIGHT;
          
          if (col.pos <= -maxScroll) {
            col.pos += maxScroll;
          }
          col.element.style.transform = `translateY(${col.pos}px)`;
        }
      });

      animFrameId = requestAnimationFrame(update);
    }

    animFrameId = requestAnimationFrame(update);
  }

  function startTimer() {
    const display = document.getElementById("timerDisplay");
    const startTime = Date.now();

    timerInterval = setInterval(() => {
      if (!isPlaying) return;
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, timeLeft - elapsed);

      const sec = Math.floor(remaining / 1000).toString().padStart(2, '0');
      const ms = (remaining % 1000).toString().padStart(3, '0');
      display.innerText = `00:${sec}:${ms}`;

      if (remaining <= 0) {
        failGame("TIJD IS OM! HACK MISLUKT.");
      }
    }, 10);
  }

  function handleKeyPress(e) {
    if (!isPlaying) return;
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      checkCurrentColumn();
    }
  }

  function checkCurrentColumn() {
    const col = columnsData[currentColIndex];
    if (!col || col.isLocked) return;

    const currentScroll = Math.abs(col.pos);
    const hitIndex = Math.round((currentScroll + TARGET_BOX_Y) / ITEM_HEIGHT);
    
    const letterDivs = col.element.getElementsByClassName("letter");
    const hitLetter = letterDivs[hitIndex] ? letterDivs[hitIndex].innerText : "";

    if (hitLetter === TARGET_WORD[currentColIndex]) {
      col.isLocked = true;
      col.colElement.classList.remove("active");
      col.colElement.classList.add("locked");

      const snappedPos = -(hitIndex * ITEM_HEIGHT - TARGET_BOX_Y);
      col.pos = snappedPos;
      col.element.style.transform = `translateY(${snappedPos}px)`;

      if (letterDivs[hitIndex]) {
        letterDivs[hitIndex].classList.remove("target-seek");
        letterDivs[hitIndex].classList.add("target-letter");
      }

      currentColIndex++;

      if (currentColIndex >= TARGET_WORD.length) {
        winGame();
      } else {
        columnsData[currentColIndex].colElement.classList.add("active");
      }
    } else {
      failGame("FOUTIEVE LETTER! TOEGANG GEWEIGERD.");
    }
  }

  function winGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    const msg = document.getElementById("statusMsg");
    msg.innerText = "Successfully acquired the password.";
    msg.className = "status-msg success";
  }

  function failGame(reason) {
    isPlaying = false;
    clearInterval(timerInterval);
    const msg = document.getElementById("statusMsg");
    msg.innerText = reason;
    msg.className = "status-msg failed";
  }

  window.addEventListener("keydown", handleKeyPress);
  startGame();
</script>

</body>
</html>
