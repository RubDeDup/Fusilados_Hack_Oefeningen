<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Matching Hack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: #11161b;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
      width: 480px;
      position: relative;
    }

    .header-title {
      font-size: 0.85rem;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .target-box {
      background-color: #0b1319;
      border: 1px solid #0284c7;
      padding: 12px;
      border-radius: 6px;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 6px;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .timer-container {
      width: 100%;
      height: 6px;
      background-color: #1e293b;
      border-radius: 3px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background-color: #38bdf8;
      transition: width 0.1s linear;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      background: #090d12;
      padding: 10px;
      border-radius: 8px;
    }

    .cell {
      padding: 8px 0;
      font-size: 0.95rem;
      color: #64748b;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s ease;
    }

    .cell.highlight {
      background-color: #0284c7;
      color: #ffffff;
      font-weight: bold;
    }

    .instructions {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    kbd {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-weight: bold;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.97);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0369a1;
    }

    .watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body onclick="window.focus()">

  <div class="container">
    <div class="header-title">Connecting to Host</div>
    
    <div class="target-box" id="targetBox">00 00 00 00</div>

    <div class="timer-container">
      <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="instructions">
      Klik met <kbd>Muis</kbd> of gebruik <kbd>Pijltoetsen</kbd> + <kbd>ENTER</kbd>
    </div>

    <div class="overlay" id="overlay">
      <div class="status-icon" id="statusIcon">✓</div>
      <h2 id="overlayTitle" style="color: #22c55e;">SYSTEM HACKED</h2>
      <p id="overlaySub" style="color: #94a3b8; margin-top: 5px; font-size: 0.9rem;">Verbinding succesvol opgesteld.</p>
      <button class="btn" onclick="startGame()">Opnieuw Spelen</button>
    </div>
  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const grid = document.getElementById('grid');
  const targetBox = document.getElementById('targetBox');
  const timerBar = document.getElementById('timerBar');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const statusIcon = document.getElementById('statusIcon');

  const rows = 7;
  const cols = 8;
  const targetLength = 4;
  
  let targetSequence = [];
  let gridNumbers = [];
  let hoveredIndex = 0;
  
  let timeLeft = 100;
  let timerInterval;
  let moveInterval;
  let isGameActive = false;

  function generateNumber() {
    return (Math.floor(Math.random() * 90) + 10).toString();
  }

  function startGame() {
    window.focus();
    overlay.classList.remove('show');
    clearInterval(timerInterval);
    clearInterval(moveInterval);
    isGameActive = true;
    timeLeft = 100;

    targetSequence = [];
    for (let i = 0; i < targetLength; i++) {
      targetSequence.push(generateNumber());
    }
    targetBox.innerText = targetSequence.join(' ');

    const totalCells = rows * cols;
    gridNumbers = [];
    for (let i = 0; i < totalCells; i++) {
      gridNumbers.push(generateNumber());
    }

    const randomPos = Math.floor(Math.random() * (totalCells - targetLength));
    for (let i = 0; i < targetLength; i++) {
      gridNumbers[randomPos + i] = targetSequence[i];
    }

    hoveredIndex = 0;
    renderGrid();
    startTimer();

    moveInterval = setInterval(() => {
      if (!isGameActive) return;
      
      const firstNum = gridNumbers.shift();
      gridNumbers.push(firstNum);
      
      renderGrid();
    }, 2000);
  }

  function renderGrid() {
    grid.innerHTML = '';
    const maxIdx = gridNumbers.length - targetLength;

    gridNumbers.forEach((num, idx) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.innerText = num;

      if (idx >= hoveredIndex && idx < hoveredIndex + targetLength) {
        cell.classList.add('highlight');
      }

      cell.addEventListener('mouseenter', () => {
        if (!isGameActive) return;
        hoveredIndex = Math.min(idx, maxIdx);
        renderGrid();
      });

      cell.addEventListener('click', () => {
        if (!isGameActive) return;
        hoveredIndex = Math.min(idx, maxIdx);
        checkSelection(hoveredIndex);
      });

      grid.appendChild(cell);
    });
  }

  window.addEventListener('keydown', (e) => {
    if (!isGameActive) return;

    const maxIdx = gridNumbers.length - targetLength;

    if (e.key === 'ArrowRight') {
      e.preventDefault();
      hoveredIndex = Math.min(hoveredIndex + 1, maxIdx);
      renderGrid();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      hoveredIndex = Math.max(hoveredIndex - 1, 0);
      renderGrid();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      hoveredIndex = Math.min(hoveredIndex + cols, maxIdx);
      renderGrid();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      hoveredIndex = Math.max(hoveredIndex - cols, 0);
      renderGrid();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      checkSelection(hoveredIndex);
    }
  });

  function checkSelection(index) {
    if (!isGameActive) return;

    const selectedSeq = gridNumbers.slice(index, index + targetLength);
    const isCorrect = selectedSeq.join(' ') === targetSequence.join(' ');

    isGameActive = false;
    clearInterval(timerInterval);
    clearInterval(moveInterval);

    if (isCorrect) {
      statusIcon.innerText = "✓";
      statusIcon.style.color = "#22c55e";
      overlayTitle.innerText = "SYSTEM HACKED";
      overlayTitle.style.color = "#22c55e";
      overlaySub.innerText = "Toegang succesvol verleend.";
    } else {
      statusIcon.innerText = "✕";
      statusIcon.style.color = "#ef4444";
      overlayTitle.innerText = "ACCESS DENIED";
      overlayTitle.style.color = "#ef4444";
      overlaySub.innerText = "Verkeerde combinatie gekozen.";
    }

    overlay.classList.add('show');
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft -= 0.7;
      timerBar.style.width = `${Math.max(0, timeLeft)}%`;

      if (timeLeft <= 0) {
        isGameActive = false;
        clearInterval(timerInterval);
        clearInterval(moveInterval);
        
        statusIcon.innerText = "✕";
        statusIcon.style.color = "#ef4444";
        overlayTitle.innerText = "TIME EXPIRED";
        overlayTitle.style.color = "#ef4444";
        overlaySub.innerText = "Tijd is verlopen.";
        overlay.classList.add('show');
      }
    }, 100);
  }

  startGame();
</script>

</body>
</html>
