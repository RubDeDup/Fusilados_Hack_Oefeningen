<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Grid Hack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: #161922;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 440px;
      position: relative;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #8a8f9d;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      width: 340px;
      height: 340px;
      margin: 0 auto;
      background-color: #11131a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #232730;
    }

    .tile {
      background-color: #1e222d;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .tile:hover {
      background-color: #2b303c;
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.active {
      background-color: #ffffff !important;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .tile.correct {
      background-color: #22c55e !important;
    }

    .tile.wrong {
      background-color: #ef4444 !important;
    }

    .status-bar {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #a0a5b5;
      min-height: 24px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 25, 34, 0.96);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }

    .watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MEMORY GRID HACK</h1>
    <p class="subtitle">Onthoud de oplichtende vakjes</p>

    <div class="grid" id="grid"></div>

    <div class="status-bar" id="status">Onthoud het patroon...</div>

    <div class="overlay" id="overlay">
      <div class="status-icon" id="statusIcon">✓</div>
      <h2 id="overlayTitle" style="color: #22c55e;">SYSTEM HACKED</h2>
      <p id="overlaySub" style="color: #94a3b8; font-size: 0.85rem; margin-top: 5px;">Patroon succesvol gereproduceerd.</p>
      <button class="btn" onclick="startGame()">Opnieuw Spelen</button>
    </div>
  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const gridContainer = document.getElementById('grid');
  const statusText = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const statusIcon = document.getElementById('statusIcon');

  const gridSize = 36;
  const targetCount = 12;
  
  let targetPattern = [];
  let userPattern = [];
  let isClickable = false;

  function createGrid() {
    gridContainer.innerHTML = '';
    for (let i = 0; i < gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.dataset.index = i;
      tile.addEventListener('click', handleTileClick);
      gridContainer.appendChild(tile);
    }
  }

  function startGame() {
    overlay.classList.remove('show');
    userPattern = [];
    isClickable = false;
    statusText.innerText = "Onthoud het patroon...";

    const tiles = document.querySelectorAll('.tile');
    tiles.forEach(tile => tile.className = 'tile');

    targetPattern = [];
    while (targetPattern.length < targetCount) {
      const rand = Math.floor(Math.random() * gridSize);
      if (!targetPattern.includes(rand)) {
        targetPattern.push(rand);
      }
    }

    targetPattern.forEach(idx => {
      tiles[idx].classList.add('active');
    });

    setTimeout(() => {
      tiles.forEach(tile => tile.classList.remove('active'));
      isClickable = true;
      statusText.innerText = "Klik op de onthouden vakjes!";
    }, 2500);
  }

  function handleTileClick(e) {
    if (!isClickable) return;

    const tile = e.target;
    const index = parseInt(tile.dataset.index);

    if (userPattern.includes(index)) return;

    if (targetPattern.includes(index)) {
      tile.classList.add('correct');
      userPattern.push(index);

      if (userPattern.length === targetCount) {
        isClickable = false;
        showEndScreen(true, "SYSTEM HACKED", "Alle vakjes correct gevonden!");
      }
    } else {
      tile.classList.add('wrong');
      isClickable = false;

      targetPattern.forEach(idx => {
        const t = document.querySelector(`[data-index='${idx}']`);
        t.classList.add('active');
      });

      showEndScreen(false, "ACCESS DENIED", "Verkeerd vakje aangeklikt.");
    }
  }

  function showEndScreen(success, title, sub) {
    statusIcon.innerText = success ? "✓" : "✕";
    statusIcon.style.color = success ? "#22c55e" : "#ef4444";
    overlayTitle.innerText = title;
    overlayTitle.style.color = success ? "#22c55e" : "#ef4444";
    overlaySub.innerText = sub;

    setTimeout(() => overlay.classList.add('show'), 400);
  }

  createGrid();
  startGame();
</script>

</body>
</html>
