<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados hub - Login</title>
  
  <!-- Favicon / Tabblad Icoontje -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1013;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Subtiele geanimeerde achtergrond gloed */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      background: #16181d;
      border: 1px solid #232730;
      border-radius: 16px;
      padding: 40px 35px;
      width: 380px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 15px auto;
      display: block;
      border-radius: 12px;
    }

    h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f1013;
      border: 1px solid #232730;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #fbbf24;
      color: #0f1013;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .login-btn:hover {
      background-color: #f59e0b;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 15px;
      min-height: 18px;
    }

    .watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="fusilados.png" alt="Fusilados Logo" class="logo">
    <h1>Fusilados hub</h1>
    <p class="subtitle">Voer je referenties in om toegang te krijgen</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="username">Gebruikersnaam</label>
        <input type="text" id="username" placeholder="Gebruikersnaam..." required autocomplete="off">
      </div>

      <div class="input-group">
        <label for="password">Wachtwoord / Toegangscode</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">INLOGGEN</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  // Instellingen voor inloggegevens (Pas deze aan naar wens!)
  const CORRECT_USER = "fusilados";
  const CORRECT_PASS = "1234";

  // Controleer of de gebruiker al ingelogd is
  if (sessionStorage.getItem("isLoggedIn") === "true") {
    window.location.href = "index.html";
  }

  function handleLogin(event) {
    event.preventDefault();

    const userVal = document.getElementById("username").value.trim();
    const passVal = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    // Simpele check (je kunt 'CORRECT_USER' en 'CORRECT_PASS' hierboven aanpassen)
    if (userVal.toLowerCase() === CORRECT_USER.toLowerCase() && passVal === CORRECT_PASS) {
      sessionStorage.setItem("isLoggedIn", "true");
      window.location.href = "index.html";
    } else {
      errorMsg.innerText = "Ongeldige gebruikersnaam of wachtwoord!";
      document.getElementById("password").value = "";
    }
  }
</script>

</body>
</html>
