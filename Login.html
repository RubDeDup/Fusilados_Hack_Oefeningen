<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados Hub - Inloggen</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f1013; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }

    .login-card { background: #16181d; border: 1px solid #232730; border-radius: 16px; padding: 36px; width: 100%; max-width: 380px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; }
    .brand-logo { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; border-radius: 12px; }
    .title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 24px; }

    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    
    /* INPUT CONTAINER VOOR HET OOGJE */
    .password-wrapper { position: relative; width: 100%; }
    .form-group input { width: 100%; padding: 12px 40px 12px 14px; background: #0f1013; border: 1px solid #232730; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: #fbbf24; }

    .toggle-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 1.1rem; opacity: 0.6; transition: opacity 0.2s; }
    .toggle-eye:hover { opacity: 1; }

    .btn-login { width: 100%; padding: 12px; background: #fbbf24; color: #0f1013; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-login:hover { background: #f59e0b; }

    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 14px; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="fusilados.png" alt="Fusilados Logo" class="brand-logo">
    <div class="title">Fusilados Hub</div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Gebruikersnaam</label>
        <input type="text" id="usernameInput" required placeholder="Voer je naam in">
      </div>

      <div class="form-group">
        <label>Wachtwoord</label>
        <div class="password-wrapper">
          <input type="password" id="passwordInput" required placeholder="••••••••">
          <span class="toggle-eye" id="toggleEye" onclick="togglePasswordVisibility()">👁️</span>
        </div>
      </div>

      <button type="submit" class="btn-login">Inloggen</button>
      <div class="error-msg" id="errorMsg">Ongeldige gebruikersnaam of wachtwoord!</div>
    </form>
  </div>

<script>
  const SUPABASE_URL = "https://suimuvzfrhtqxprzzojy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LTp-t_e2PX8kF-L-Du1dDw_cY9QNfKJ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById("passwordInput");
    const eyeIcon = document.getElementById("toggleEye");

    if (pwdInput.type === "password") {
      pwdInput.type = "text";
      eyeIcon.innerText = "🙈";
    } else {
      pwdInput.type = "password";
      eyeIcon.innerText = "👁️";
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById("usernameInput").value.trim();
    const password = document.getElementById("passwordInput").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.style.display = "none";

    const { data, error } = await _supabase
      .from('users')
      .select('*')
      .eq('username', username)
      .eq('password', password)
      .single();

    if (error || !data) {
      errorMsg.style.display = "block";
      return;
    }

    sessionStorage.setItem("currentUser", data.username);
    sessionStorage.setItem("currentRole", data.role || "Gringo");

    window.location.href = "index.html";
  }
</script>

</body>
</html>
